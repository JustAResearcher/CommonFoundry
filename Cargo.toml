[workspace]
members = [
    "apps/wallet/src-tauri",
    "crates/cmfd-consensus",
    "crates/cmfd-marketplace",
    "crates/cmfd-node",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
primitive-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
